<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sneaker Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="img">
        <!-- Yeh naya wrapper container hai jo dono cards ko ek sath center karega -->
        <div class="card-wrapper">
            <div class="card-1">
                <img src="https://static.vecteezy.com/system/resources/thumbnails/047/758/759/small_2x/colorful-cool-running-sneakers-mockup-vibrant-colors-isolated-on-a-transparent-background-free-png.png" width="400">
            </div>
            <div class="card-2">
                <h1>AIR MAX</h1>
                <h3>Winter Collection <br><span>Rainbow Sneakers</span></h3>
                
                <div class="price-container">
                    <span class="old-price">$200</span>
                    <span class="new-price">$150</span>
                </div>

                <div class="color-section">
                    <span>colour</span>
                    <div class="dot yellow"></div>
                    <div class="dot black"></div>
                    <div class="dot blue"></div>
                </div>

                <div class="size-section-wrapper">
                    <span class="size">size</span>
                    <div class="size-container">
                        <div class="seven">7</div>
                        <div class="eight">8</div>
                        <div class="nine">9</div>
                        <div class="ten">10</div>
                        <div class="eleven">11</div>
                    </div>
                </div>

                <div class="btn-section">
                    <button class="btn">Buy Now</button>
                    <button class="btn">Add To Cart</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
