<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="./style.css">
      
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>Product Card</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <!-- backgroung image -->
    <div class="img">
        <div class="card-1">
            <img src="https://static.vecteezy.com/system/resources/thumbnails/047/758/759/small_2x/colorful-cool-running-sneakers-mockup-vibrant-colors-isolated-on-a-transparent-background-free-png.png" alt="shoe" width="450">

        </div>
        <div class="card-2">
            <h1>🅰🅸🆁🅼🅰🆇</h1>
            <div class="icon-1">
            <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <div class="icon-2">
            <i class="fa-regular fa-user"></i>
            </div>
            <div class="icon-3">
            <i class="fa-solid fa-cart-shopping"></i>
            </div>
            <h3>Ｗｉｎｔｅｒ Ｃｏｌｌｅｃｔｉｏｎ</h3>

            <h4>Ｒａｉｎｂｏｗ Ｓｎｅａｋｅｒｓ</h4>

            <div class="price-container">
                <del class="old-price">$200</del>
                <span class="new-price">$150</span>
            <div class="colours">
                <span>colour</span>
                <span class="yellow dot"></span>
                <span class="black dot"></span>
                <span class="blue dot"></span>
            </div>

            <!-- button -->
             <div class="btn">
                <button class="btn-1"><i class="fa-solid fa-bag-shopping"></i>buy Now</button>
                <button class="btn-2"><i class="fa-solid fa-cart-arrow-down"></i>Add To Cart</button>
            </div>
            <div class="size-container">
                <span>size</span>
                <span class="seven">7</span>
                <span class="eight">8</span>
                <span class="nine">9</span>
                 <span class="ten">10</span>
                  <span class="eleven">11</span>
            </div>
        
              
            </div>
             </div>

    
           
            
            
         

        </div>
    </div>
    <!-- x--------x -->
     



</body>
</html>
